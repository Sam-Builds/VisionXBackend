name: Deploy UIBackend Service

on:
  push:
    branches: [ main ]
    paths:
      - 'UIBackend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          chmod +x UIBackend/deploy.sh
          ./UIBackend/deploy.sh
